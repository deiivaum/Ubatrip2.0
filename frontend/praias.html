<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBATRIP - Catálogo de Praias de Ubatuba</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Overlay & Drawer menu -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
    <div class="drawer-nav" id="drawer-nav">
        <button class="drawer-close" onclick="toggleDrawer()">&times;</button>
        <a href="index.html" onclick="toggleDrawer()">Início</a>
        <a href="praias.html" onclick="toggleDrawer()">Praias & Trilhas</a>
        <a href="gallery.html" onclick="toggleDrawer()">Galeria Comunitária</a>
        <a href="admin.html" onclick="toggleDrawer()">Painel Admin</a>
        <div id="drawer-auth-links" style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;"></div>
    </div>

    <!-- Header com Logo e Menu -->
    <header>
        <a href="index.html" class="logo-link">UBATRIP</a>
        
        <div class="nav-right">
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="praias.html" style="font-weight: 700; color: var(--olive-btn);">Praias</a>
                <a href="gallery.html">Galeria</a>
            </nav>
            <div id="auth-links" class="auth-nav"></div>
            <button class="menu-btn" onclick="toggleDrawer()" aria-label="Abrir menu">
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main style="max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 5rem; width: 100%;">
        <!-- Hero Section do Catálogo de Praias -->
        <section class="gallery-hero" style="padding-top: 1rem; padding-bottom: 2rem;">
            <h1>PRAIAS DE UBATUBA</h1>
            <p>MAIS DE 100 PRAIAS, ILHAS E CACHOEIRAS PARA EXPLORAR</p>
        </section>

        <!-- Barra de Ações: Busca, Filtros de Região e Botão de Cadastrar Praia -->
        <div class="beaches-controls-bar">
            <!-- Campo de Busca -->
            <div class="search-box">
                <input type="text" id="beach-search-input" placeholder="🔍 Buscar praia pelo nome ou atrativo (ex: Félix, Surf, Trilha)...">
            </div>

            <!-- Botão Cadastrar Praia (Página Dedicada) -->
            <div>
                <a href="cadastrar-praia.html" class="btn-pill" style="padding: 0.75rem 1.8rem; font-size: 0.85rem; background: var(--olive-btn); display: flex; align-items: center; gap: 0.5rem; text-decoration: none;">
                    <span>➕</span> Cadastrar Nova Praia
                </a>
            </div>
        </div>

        <!-- Filtros por Região (Pills) -->
        <div class="region-filter-pills" id="region-filters">
            <button class="filter-pill active" data-region="todas">Todas as Praias</button>
            <button class="filter-pill" data-region="norte">Região Norte</button>
            <button class="filter-pill" data-region="centro">Região Central</button>
            <button class="filter-pill" data-region="sul">Região Sul</button>
            <button class="filter-pill" data-region="ilhas">Ilhas de Ubatuba</button>
        </div>

        <!-- Contador de Praias -->
        <div style="margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
            Mostrando <strong id="beaches-count">0</strong> praias cadastradas
        </div>

        <!-- Grade Galeria de Praias (Cada card redireciona para a praia) -->
        <section class="praias-cards-grid" id="praias-catalog-grid">
            <!-- Cards injetados dinamicamente via JS -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 UbaTrip — Guia das Praias de Ubatuba</p>
    </footer>

    <script src="js/auth.js?v=5"></script>
    <script src="js/praias-data.js?v=5"></script>
    <script src="js/praias-catalog.js?v=5"></script>
    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('drawer-nav');
            const overlay = document.getElementById('drawer-overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('active');
        }
    </script>
</body>
</html>
