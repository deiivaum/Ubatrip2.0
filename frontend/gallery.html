<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBATRIP - Galeria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Overlay & Drawer menu -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
    <div class="drawer-nav" id="drawer-nav">
        <button class="drawer-close" onclick="toggleDrawer()">&times;</button>
        <a href="index.html" onclick="toggleDrawer()">Início</a>
        <a href="praias.html">Catálogo de Praias (100+)</a>
        <a href="index.html#mapa" onclick="toggleDrawer()">Mapa Costeiro</a>
        <a href="gallery.html" onclick="toggleDrawer()">Galeria Comunitária</a>
        <a href="index.html#sobre" onclick="toggleDrawer()">Sobre Ubatuba</a>
        <div id="drawer-auth-links" style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;"></div>
    </div>

    <!-- Header com Logo e Hamburger Menu -->
    <header>
        <a href="index.html" class="logo-link">UBATRIP</a>
        
        <div class="nav-right">
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="praias.html">Praias (+100)</a>
                <a href="index.html#mapa">Mapa</a>
                <a href="gallery.html" style="font-weight: 700; color: var(--olive-btn);">Galeria</a>
            </nav>
            <div id="auth-links" class="auth-nav"></div>
            <button class="menu-btn" onclick="toggleDrawer()" aria-label="Abrir menu">
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>
        <section class="gallery-hero">
            <h1>GALERIA</h1>
            <p>MOMENTOS E REGISTROS EM UBATUBA</p>
        </section>

        <!-- Formulário para envio de foto (visível para usuários logados) -->
        <div id="upload-section" class="upload-card" style="display: none;">
            <h3>Adicionar Nova Foto</h3>
            <form id="upload-form" class="upload-form">
                <input type="file" id="image-file" accept="image/*" required>
                <input type="text" id="image-desc" placeholder="Adicione uma legenda ou nome do local...">
                <button type="submit" class="btn-pill" style="align-self: center; width: 100%;">Enviar para a Galeria</button>
            </form>
        </div>

        <!-- Alerta para usuários não logados -->
        <div id="login-prompt" style="text-align: center; margin-bottom: 2.5rem; color: var(--text-muted); font-size: 0.9rem;">
            Deseja compartilhar suas fotos? <a href="login.html" style="color: var(--olive-btn); font-weight: 600; text-decoration: underline;">Faça login</a> ou <a href="register.html" style="color: var(--olive-btn); font-weight: 600; text-decoration: underline;">cadastre-se</a>.
        </div>

        <!-- Grade de imagens -->
        <section class="gallery-masonry" id="gallery-grid">
            <!-- Imagens injetadas via gallery.js -->
        </section>

        <!-- Modal para Expandir Foto -->
        <div id="image-modal" class="image-modal-overlay" onclick="closeImageModal(event)">
            <div class="image-modal-content" onclick="event.stopPropagation()">
                <button class="modal-close-btn" onclick="closeImageModal()">&times;</button>
                <div class="modal-image-wrapper">
                    <img id="modal-image" src="" alt="Foto expandida">
                </div>
                <div class="modal-details">
                    <p id="modal-caption" class="modal-caption-text"></p>
                    <p id="modal-author" class="modal-author-text"></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 UbaTrip — Seu Guia em Ubatuba</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/gallery.js"></script>
    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('drawer-nav');
            const overlay = document.getElementById('drawer-overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('active');
        }
    </script>
</body>
</html>
