<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBATRIP - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <!-- Botão de Voltar (Seta no canto superior esquerdo idêntica ao Frame 1) -->
    <a href="index.html" class="back-arrow" title="Voltar para a página inicial">&larr;</a>

    <div class="auth-card">
        <!-- Título em Serif maiúsculo idêntico ao Mockup -->
        <h1 class="auth-title">CADASTRO</h1>

        <form id="register-form" class="auth-form">
            <input type="text" id="name" class="pill-input" placeholder="nome completo" required>
            <input type="email" id="email" class="pill-input" placeholder="email" required>
            <input type="password" id="password" class="pill-input" placeholder="senha" required>

            <button type="submit" class="auth-submit-btn">Cadastrar</button>
        </form>

        <!-- Ícones Sociais (Google e Facebook idênticos ao Mockup Frame 1) -->
        <div class="social-icons">
            <span class="social-pill" onclick="alert('Login social com Google em breve')">
                <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16C3.7 19.7 7.5 22.3 12 23z"/></svg>
                google
            </span>
            <span class="social-pill" onclick="alert('Login social com Facebook em breve')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                facebook
            </span>
        </div>

        <p class="auth-footer-text">
            Já tem uma conta? <a href="login.html">Faça login</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
