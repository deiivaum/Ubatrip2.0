services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ubatrip_user
      POSTGRES_PASSWORD: ubatrip_password
      POSTGRES_DB: ubatrip_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
